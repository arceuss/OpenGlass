name: Scheduled Windows 11 caption port build

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build-port:
    name: build port/25h2-caption-text
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: x64
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.ci-cache\vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.ci-cache\vcpkg-binary-cache,readwrite

    steps:
      - name: Checkout engineering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: port/25h2-caption-text
          fetch-depth: 0

      - name: Gate one-shot build
        id: gate
        run: |
          if (Test-Path -LiteralPath '.ci\caption-port-last-run.log') {
              'run=false' >> $env:GITHUB_OUTPUT
              Write-Host 'A previous scheduled result exists; skipping until it is cleared.'
          }
          else {
              'run=true' >> $env:GITHUB_OUTPUT
              New-Item -ItemType Directory -Force -Path .ci | Out-Null
              @(
                  "run_id=${{ github.run_id }}",
                  "event=${{ github.event_name }}",
                  "sha=${{ github.sha }}",
                  "started=$([DateTimeOffset]::UtcNow.ToString('O'))"
              ) | Set-Content -LiteralPath .ci\caption-port-last-run.log -Encoding utf8
          }

      - name: Validate target base
        if: steps.gate.outputs.run == 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git cat-file -e "2364db1fd42112acb9673fcd76731496607537b8^{commit}"
          git merge-base --is-ancestor 2364db1fd42112acb9673fcd76731496607537b8 HEAD
          if ($LASTEXITCODE -ne 0) {
              throw 'Engineering branch is no longer based on the inspected OpenGlass- revision.'
          }

      - name: Materialize and apply caption port
        if: steps.gate.outputs.run == 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $parts = @(Get-ChildItem -LiteralPath .ci -Filter 'caption-port-payload.b64.part*' | Sort-Object Name)
          if ($parts.Count -ne 5) {
              throw "Expected 5 caption port payload parts, found $($parts.Count)."
          }
          $encoded = ($parts | ForEach-Object {
              [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::ASCII).Trim()
          }) -join ''
          $zipPath = Join-Path $PWD '.ci\caption-port-payload.zip'
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($encoded))
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = '86645a3ef53178bd4ee3800db27c8cec9c20bcf7902fa2f4aa2e016a01e05f81'
          if ($actualHash -ne $expectedHash) {
              throw "Caption port payload hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $PWD -Force
          & .\Scripts\ApplyCaptionText25H2Port.ps1 *>&1 |
              Tee-Object -LiteralPath .ci\caption-port-last-run.log -Append

      - name: Compile caption shaders
        if: steps.gate.outputs.run == 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter fxc.exe -File -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          if (-not $fxc) {
              throw 'fxc.exe was not found in the installed Windows SDK.'
          }
          & $fxc.FullName /nologo /T vs_5_0 /E main /Fo OpenGlass\CaptionText.VS.cso OpenGlass\CaptionText.VS.hlsl *>&1 |
              Tee-Object -LiteralPath .ci\caption-port-last-run.log -Append
          if ($LASTEXITCODE -ne 0) { throw "CaptionText.VS.hlsl failed with exit code $LASTEXITCODE." }
          & $fxc.FullName /nologo /T ps_5_0 /E main /Fo OpenGlass\CaptionText.PS.cso OpenGlass\CaptionText.PS.hlsl *>&1 |
              Tee-Object -LiteralPath .ci\caption-port-last-run.log -Append
          if ($LASTEXITCODE -ne 0) { throw "CaptionText.PS.hlsl failed with exit code $LASTEXITCODE." }

      - name: Set up MSBuild
        if: steps.gate.outputs.run == 'true'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Resolve vcpkg root
        if: steps.gate.outputs.run == 'true'
        run: |
          $candidates = @($env:VCPKG_INSTALLATION_ROOT, 'C:\vcpkg') | Where-Object { $_ }
          $root = $candidates | Where-Object {
              Test-Path -LiteralPath (Join-Path $_ 'scripts\buildsystems\msbuild\vcpkg.props')
          } | Select-Object -First 1
          if (-not $root) {
              throw "vcpkg MSBuild integration not found in: $($candidates -join ', ')"
          }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      - name: Cache NuGet packages
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.nuget\packages
            ${{ github.workspace }}\packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-caption-port-${{ hashFiles('**/packages.config', 'Common/NuGet.props', 'Common/NuGet.targets') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Cache vcpkg binary packages
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.ci-cache\vcpkg-binary-cache
          key: ${{ runner.os }}-${{ runner.arch }}-v145-caption-port-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-v145-x64-windows-static-

      - name: Initialize cache directories
        if: steps.gate.outputs.run == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Build patched Legacy architecture
        if: steps.gate.outputs.run == 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path MSBuild_Logs | Out-Null
          msbuild OpenGlass\OpenGlass.Legacy.vcxproj /m /restore `
            /p:Configuration=$env:BUILD_CONFIGURATION `
            /p:Platform=$env:BUILD_PLATFORM `
            /p:RestorePackagesConfig=true `
            /p:ForceImportBeforeCppProps=$env:VCPKG_ROOT\scripts\buildsystems\msbuild\vcpkg.props `
            /p:ForceImportAfterCppTargets=$env:VCPKG_ROOT\scripts\buildsystems\msbuild\vcpkg.targets `
            /p:OpenGlassInstallerEnabled=false `
            /bl:MSBuild_Logs\caption-port.binlog *>&1 |
              Tee-Object -LiteralPath .ci\caption-port-last-run.log -Append
          if ($LASTEXITCODE -ne 0) {
              throw "Legacy OpenGlass build failed with exit code $LASTEXITCODE."
          }
          $dll = Get-ChildItem -LiteralPath Build -Filter OpenGlass.dll -File -Recurse |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
          if (-not $dll -or $dll.Length -eq 0) {
              throw 'Built OpenGlass.dll was not found or is empty.'
          }
          "dll_path=$($dll.FullName)" | Add-Content -LiteralPath .ci\caption-port-last-run.log
          Copy-Item -LiteralPath $dll.FullName -Destination MSBuild_Logs\OpenGlass-caption-25H2.dll -Force
          $pdb = [IO.Path]::ChangeExtension($dll.FullName, '.pdb')
          if (Test-Path -LiteralPath $pdb) {
              Copy-Item -LiteralPath $pdb -Destination MSBuild_Logs\OpenGlass-caption-25H2.pdb -Force
          }

      - name: Stage source patch
        if: steps.gate.outputs.run == 'true'
        id: stage
        run: |
          $paths = @(
              'OpenGlass/Architecture/Legacy/CaptionTextHandler.cpp',
              'OpenGlass/Architecture/Legacy/CaptionTextRealizer.cpp',
              'OpenGlass/Architecture/Legacy/CaptionTextRealizer.hpp',
              'OpenGlass/Architecture/Legacy/CaptionTextReplacement.cpp',
              'OpenGlass/Architecture/Legacy/CaptionTextReplacement.hpp',
              'OpenGlass/Architecture/Legacy/GlassRenderer.cpp',
              'OpenGlass/CaptionText.PS.cso',
              'OpenGlass/CaptionText.PS.hlsl',
              'OpenGlass/CaptionText.VS.cso',
              'OpenGlass/CaptionText.VS.hlsl',
              'OpenGlass/OpenGlass.Legacy.vcxproj',
              'OpenGlass/OpenGlass.Shared.vcxitems',
              'OpenGlass/OpenGlass.rc',
              'OpenGlass/resource.h'
          )
          git add -- $paths
          git diff --cached --binary -- $paths | Out-File -LiteralPath MSBuild_Logs\caption-port.patch -Encoding utf8
          git diff --cached --stat
          if (git diff --cached --quiet) {
              'changed=false' >> $env:GITHUB_OUTPUT
          }
          else {
              'changed=true' >> $env:GITHUB_OUTPUT
          }

      - name: Finalize success log
        if: steps.gate.outputs.run == 'true'
        run: |
          @(
              "finished=$([DateTimeOffset]::UtcNow.ToString('O'))",
              'job_status=success'
          ) | Add-Content -LiteralPath .ci\caption-port-last-run.log

      - name: Upload build, symbols, patch, and binary log
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caption-text-25h2-${{ github.run_id }}
          path: |
            MSBuild_Logs/OpenGlass-caption-25H2.dll
            MSBuild_Logs/OpenGlass-caption-25H2.pdb
            MSBuild_Logs/caption-port.patch
            MSBuild_Logs/caption-port.binlog
          if-no-files-found: error
          retention-days: 14

      - name: Commit build-tested port
        if: steps.gate.outputs.run == 'true' && steps.stage.outputs.changed == 'true'
        run: |
          git add -- .ci/caption-port-last-run.log
          git config user.name 'OpenGlass caption port CI'
          git config user.email '28229451+arceuss@users.noreply.github.com'
          git commit -m "Port Win7 caption text rendering to Windows 11 25H2 [run ${{ github.run_id }}]"
          git push origin HEAD:port/25h2-caption-text

      - name: Record failure on engineering branch
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          @(
              "finished=$([DateTimeOffset]::UtcNow.ToString('O'))",
              'job_status=failure'
          ) | Add-Content -LiteralPath .ci\caption-port-last-run.log
          git reset --mixed HEAD
          git add -- .ci/caption-port-last-run.log
          git config user.name 'OpenGlass caption port CI'
          git config user.email '28229451+arceuss@users.noreply.github.com'
          git commit -m "ci: record caption port failure [run ${{ github.run_id }}]"
          git push origin HEAD:port/25h2-caption-text
